name: Build and Deploy Snapshot
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task selector to run instead of the full suite (e.g. :spring-webflux:test --tests FooTests)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-deploy-snapshot:
    name: Build and Deploy Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Out Code
        uses: actions/checkout@v6
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          publish: true
          test-filter: ${{ inputs.test-filter }}
      - name: Upload spring-webflux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: spring-webflux
          path: deployment-repository/org/springframework/spring-webflux/*/spring-webflux-*.jar
          if-no-files-found: error
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}
